name: farshift-local

services:
  app:
    build: .
    volumes:
      - ./ui-config.yaml:/app/web/ui-config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FARSHIFT_ORIGIN: http://127.0.0.1:8080
      FARSHIFT_STUN_URLS: ""
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

include /etc/nginx/farshift-http.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=ws_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ws_connections:10m;

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
upstream farshift {
    zone farshift 64k;
    server app:8080 resolve;
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_types text/css application/javascript application/wasm application/json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /ws {
        limit_req zone=ws_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn ws_connections 256;
        limit_conn_status 429;
        proxy_pass http://farshift;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 25h;
        proxy_send_timeout 25h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://farshift;
    }
}

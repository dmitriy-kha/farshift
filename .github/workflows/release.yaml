name: Release and deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag
        required: true
        default: v0.1.1
        type: string
      deploy:
        description: Deploy to production after publishing
        required: true
        default: true
        type: boolean
      rebuild:
        description: Rebuild images and replace the existing release manifest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: farshift-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: automation
      - name: Validate version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build, scan and publish release
        id: release
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REBUILD: ${{ inputs.rebuild || false }}
        run: bash automation/deploy/github-release.sh publish

  deploy:
    needs: publish
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: production
    permissions:
      contents: read
      packages: read
      deployments: write
    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deploy published images and verify HTTPS
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          FARSHIFT_DOMAIN: ${{ vars.FARSHIFT_DOMAIN }}
          FARSHIFT_ACME_EMAIL: ${{ secrets.FARSHIFT_ACME_EMAIL }}
          FARSHIFT_STUN_URLS: ${{ vars.FARSHIFT_STUN_URLS }}
          FARSHIFT_TURN_URLS: ${{ vars.FARSHIFT_TURN_URLS }}
          FARSHIFT_TURN_SECRET: ${{ secrets.FARSHIFT_TURN_SECRET }}
          FARSHIFT_RELAY_ONLY: ${{ vars.FARSHIFT_RELAY_ONLY }}
          FARSHIFT_MAX_ROOMS: ${{ vars.FARSHIFT_MAX_ROOMS }}
          FARSHIFT_MAX_CONNECTIONS: ${{ vars.FARSHIFT_MAX_CONNECTIONS }}
        run: bash deploy/github-release.sh deploy
